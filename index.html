<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Dashboard · Cortex</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF385C'/%3E%3Cg stroke='white' stroke-width='1.6' stroke-linecap='round'%3E%3Cline x1='16' y1='7' x2='8' y2='22'/%3E%3Cline x1='16' y1='7' x2='24' y2='22'/%3E%3Cline x1='8' y1='22' x2='24' y2='22'/%3E%3C/g%3E%3Ccircle cx='16' cy='7' r='3' fill='white'/%3E%3Ccircle cx='8' cy='22' r='3' fill='white'/%3E%3Ccircle cx='24' cy='22' r='3' fill='white'/%3E%3C/svg%3E" />

    <script>
      // Same theme-detection contract as templates/base.html, so
      // switching between the classic Django pages and this SPA (both
      // reachable in the transition period) never flips the user's
      // theme underneath them - both read/write the same 'theme' key.
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!--
      Tailwind via the same CDN JIT script templates/base.html uses,
      with the identical tailwind.config (colors/fonts/radii/shadows)
      copied verbatim - this is what makes the React pages pixel-
      identical to their Django-template predecessors: they're
      literally the same utility classes compiled by the same
      Tailwind config, not a re-approximation of the design in a
      separate build pipeline.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            },
            borderRadius: {
              xl: '12px',
              '2xl': '14px',
            },
            colors: {
              // Airbnb-derived system: one accent (Rausch) carrying every
              // primary CTA/link, used scarcely against a near-monochrome
              // canvas - see the design-system note in src/index.css above
              // the button rules for the full rationale.
              primary: { DEFAULT: '#FF385C', dark: '#E00B41', soft: '#FFD1DA', light: '#FF6B85' },
              ink:     { DEFAULT: '#222222', dark: '#F0F0F0' },
              muted:   { DEFAULT: '#6A6A6A', dark: '#A3A3A3' },
              surface: { DEFAULT: '#FFFFFF', dark: '#0A0A0A' },
              card:    { DEFAULT: '#FFFFFF', dark: '#141414' },
              line:    { DEFAULT: '#DDDDDD', dark: '#2E2E2E' },
              success: { DEFAULT: '#16A34A', dark: '#4ADE80' },
              warning: { DEFAULT: '#D97706', dark: '#FBBF24' },
              danger:  { DEFAULT: '#C13515', dark: '#E0684A' },
              info:    { DEFAULT: '#0EA5E9', dark: '#38BDF8' },
              accent:  { DEFAULT: '#460479', dark: '#A855F7' },
              sidebar: { DEFAULT: '#141414', soft: '#1E1E1E', deep: '#0A0A0A' },
            },
            boxShadow: {
              // Single shadow tier, used only on hover-floated cards and
              // dropdowns - never on static surfaces or buttons. `softer`
              // is the same recipe minus its heaviest layer, for smaller
              // elements. There is deliberately no `glow` anymore.
              soft: 'rgba(0,0,0,0.02) 0 0 0 1px, rgba(0,0,0,0.04) 0 2px 6px 0, rgba(0,0,0,0.1) 0 4px 8px 0',
              softer: 'rgba(0,0,0,0.02) 0 0 0 1px, rgba(0,0,0,0.04) 0 2px 6px 0',
            },
          },
        },
      };
    </script>

    <style>
      * { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: #DDDDDD; border-radius: 8px; }
      .dark ::-webkit-scrollbar-thumb { background: #2E2E2E; }
      html { scrollbar-width: thin; scrollbar-color: #DDDDDD transparent; }
      html.dark { scrollbar-color: #2E2E2E transparent; }
      .sidebar-scroll { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.18) transparent; }
      .sidebar-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); }

      @keyframes fade-in-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      .fade-in-up { animation: fade-in-up .35s ease-out both; }

      @keyframes ask-ai-cursor-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .streaming-cursor::after {
        content: '';
        display: inline-block;
        width: 2px;
        height: 1em;
        margin-left: 2px;
        vertical-align: text-bottom;
        background-color: currentColor;
        animation: ask-ai-cursor-blink 0.85s steps(1) infinite;
      }

      /* Ask AI ambient mesh */
      .ask-hero-mesh {
        background: radial-gradient(ellipse 70% 55% at 10% 0%, rgba(255, 56, 92, 0.08), transparent 55%);
      }
      .dark .ask-hero-mesh {
        background: radial-gradient(ellipse 70% 55% at 10% 0%, rgba(255, 56, 92, 0.16), transparent 55%);
      }
    </style>
  </head>
  <body class="bg-surface dark:bg-surface-dark text-ink dark:text-ink-dark antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
